# ============================================================
# auto-move-issues.yml
# Automatiza el movimiento de tarjetas en GitHub Projects v2
# adaptado para MargenX con columna estándar "To Do".
#
# FLUJO DE ESTADOS:
#   BACKLOG → TO DO → IN PROGRESS → IN REVIEW → QA APPROVED → DONE
#                                  ↑___QA rechaza___|
#
# ⚠️ IMPORTANTE (leer antes de tocar este archivo):
# Los eventos "issues", "create" y "pull_request_review" NO están
# atados a un commit/rama específica de una PR. GitHub SIEMPRE
# evalúa estos jobs usando la copia de este archivo que existe en
# la RAMA POR DEFECTO del repositorio (Settings → Branches → Default
# branch), sin importar en qué rama se haya editado el workflow.
#
# En cambio, el evento "pull_request" SÍ usa el ref de merge de la
# propia PR (para PRs del mismo repo). Por eso el job de IN REVIEW
# puede reflejar cambios recientes aunque vivan en una rama de
# feature, mientras que "handle_qa_review" (pull_request_review)
# puede seguir ejecutando una versión vieja -o directamente no
# ejecutar el job si no existía- hasta que este archivo esté
# actualizado en la rama por defecto.
#
# 👉 Después de modificar este archivo, mergeá siempre a la rama
#    configurada como default antes de dar por fallido un flujo que
#    dependa de pull_request_review, issues o create.
# ============================================================

name: Auto Move Issues - Project Board

on:
  issues:
    types: [assigned, unassigned]
  create:
  pull_request:
    types: [opened, closed, reopened]
    branches:
      - develop
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del PR a simular/forzar como QA APPROVED (ej: 12)"
        required: true
        type: string
      dry_run:
        description: "Modo prueba (true = solo muestra qué haría, sin mover ni comentar nada)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  # ============================================================
  # JOB 1: BACKLOG → TO DO (Al asignar issue)
  # ============================================================
  move_to_to_do:
    name: "Issue asignada → TO DO"
    if: github.event_name == 'issues' && github.event.action == 'assigned'
    runs-on: ubuntu-latest
    steps:
      - name: Mover issue a columna To Do
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORGANIZATION: ${{ vars.ORGANIZATION }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          gh api graphql -f query='
            query($org: String!, $number: Int!) {
              user(login: $org) {
                projectV2(number: $number) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' \
            -f org="$ORGANIZATION" \
            -F number=$PROJECT_NUMBER \
            > project_data.json

          PROJECT_ID=$(jq -r '.data.user.projectV2.id' project_data.json)
          STATUS_FIELD_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .id' project_data.json)
          TO_DO_OPTION_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .options[] | select(.name != null and ((.name | ascii_downcase) == "to do" or (.name | ascii_downcase) == "ready")) | .id' project_data.json)

          ITEM_ID=$(gh api graphql -f query='
            mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                item { id }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f issue="$ISSUE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project,
                itemId: $item,
                fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) {
                projectV2Item { id }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f item="$ITEM_ID" \
            -f field="$STATUS_FIELD_ID" \
            -f option="$TO_DO_OPTION_ID" \
            --silent

          echo "✅ Issue #${{ github.event.issue.number }} movida a TO DO"

  # ============================================================
  # JOB 2: TO DO → BACKLOG (Al desasignar)
  # ============================================================
  move_to_backlog_unassigned:
    name: "Issue desasignada → BACKLOG"
    if: github.event_name == 'issues' && github.event.action == 'unassigned'
    runs-on: ubuntu-latest
    steps:
      - name: Mover issue a columna Backlog
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORGANIZATION: ${{ vars.ORGANIZATION }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          gh api graphql -f query='
            query($org: String!, $number: Int!) {
              user(login: $org) {
                projectV2(number: $number) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' \
            -f org="$ORGANIZATION" \
            -F number=$PROJECT_NUMBER \
            > project_data.json

          PROJECT_ID=$(jq -r '.data.user.projectV2.id' project_data.json)
          STATUS_FIELD_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .id' project_data.json)
          BACKLOG_OPTION_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .options[] | select(.name != null and (.name | ascii_downcase) == "backlog") | .id' project_data.json)

          ITEM_ID=$(gh api graphql -f query='
            mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                item { id }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f issue="$ISSUE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project,
                itemId: $item,
                fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) {
                projectV2Item { id }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f item="$ITEM_ID" \
            -f field="$STATUS_FIELD_ID" \
            -f option="$BACKLOG_OPTION_ID" \
            --silent

          echo "📋 Issue #${{ github.event.issue.number }} devuelta a BACKLOG"

  # ============================================================
  # JOB 3: TO DO → IN PROGRESS (Al crear branch)
  # ============================================================
  move_to_in_progress:
    name: "Branch creada → IN PROGRESS"
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Extraer número de issue
        id: extract_issue
        run: |
          BRANCH="${{ github.ref_name }}"
          ISSUE_NUMBER=$(echo "$BRANCH" | grep -oP '(?<![0-9])\d+(?![0-9])' | head -1)
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "ISSUE_FOUND=false" >> $GITHUB_OUTPUT
          else
            echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
            echo "ISSUE_FOUND=true" >> $GITHUB_OUTPUT
          fi

      - name: Obtener node_id de la issue
        if: steps.extract_issue.outputs.ISSUE_FOUND == 'true'
        id: get_issue
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ steps.extract_issue.outputs.ISSUE_NUMBER }}
        run: |
          ISSUE_DATA=$(gh api /repos/${{ github.repository }}/issues/$ISSUE_NUMBER 2>/dev/null || echo "null")
          if [ "$ISSUE_DATA" = "null" ]; then
            echo "ISSUE_VALID=false" >> $GITHUB_OUTPUT
          else
            ISSUE_ID=$(echo "$ISSUE_DATA" | jq -r '.node_id')
            echo "ISSUE_ID=$ISSUE_ID" >> $GITHUB_OUTPUT
            echo "ISSUE_VALID=true" >> $GITHUB_OUTPUT
          fi

      - name: Mover a IN PROGRESS
        if: steps.get_issue.outputs.ISSUE_VALID == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORGANIZATION: ${{ vars.ORGANIZATION }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          ISSUE_ID: ${{ steps.get_issue.outputs.ISSUE_ID }}
        run: |
          gh api graphql -f query='
            query($org: String!, $number: Int!) {
              user(login: $org) {
                projectV2(number: $number) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' \
            -f org="$ORGANIZATION" \
            -F number=$PROJECT_NUMBER \
            > project_data.json

          PROJECT_ID=$(jq -r '.data.user.projectV2.id' project_data.json)
          STATUS_FIELD_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .id' project_data.json)
          IN_PROGRESS_OPTION_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .options[] | select(.name != null and (.name | ascii_downcase) == "in progress") | .id' project_data.json)

          ITEM_ID=$(gh api graphql -f query='
            mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                item { id }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f issue="$ISSUE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project,
                itemId: $item,
                fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) {
                projectV2Item { id }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f item="$ITEM_ID" \
            -f field="$STATUS_FIELD_ID" \
            -f option="$IN_PROGRESS_OPTION_ID" \
            --silent

          echo "🔄 Issue #${{ steps.extract_issue.outputs.ISSUE_NUMBER }} movida a IN PROGRESS"

  # ============================================================
  # JOB 4: IN PROGRESS → IN REVIEW (Al abrir PR)
  # ============================================================
  move_to_in_review:
    name: "PR abierto → IN REVIEW"
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Mover issues vinculadas a IN REVIEW
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORGANIZATION: ${{ vars.ORGANIZATION }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          gh api graphql -f query='
            query($org: String!, $number: Int!) {
              user(login: $org) {
                projectV2(number: $number) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' \
            -f org="$ORGANIZATION" \
            -F number=$PROJECT_NUMBER \
            > project_data.json

          PROJECT_ID=$(jq -r '.data.user.projectV2.id' project_data.json)
          STATUS_FIELD_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .id' project_data.json)
          IN_REVIEW_OPTION_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .options[] | select(.name != null and (.name | ascii_downcase) == "in review") | .id' project_data.json)

          CLOSING_ISSUES=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 25) {
                    nodes { id number }
                  }
                }
              }
            }' \
            -f owner="$REPO_OWNER" \
            -f repo="$REPO_NAME" \
            -F number=$PR_NUMBER \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]')

          if [ -z "$CLOSING_ISSUES" ]; then
            ISSUE_NUMBER=$(echo "$PR_BRANCH" | grep -oP '(?<![0-9])\d+(?![0-9])' | head -1)
            if [ -n "$ISSUE_NUMBER" ]; then
              ISSUE_DATA=$(gh api /repos/${{ github.repository }}/issues/$ISSUE_NUMBER 2>/dev/null || echo "null")
              if [ "$ISSUE_DATA" != "null" ]; then
                ISSUE_ID=$(echo "$ISSUE_DATA" | jq -r '.node_id')
                CLOSING_ISSUES="{\"id\":\"$ISSUE_ID\",\"number\":$ISSUE_NUMBER}"
              fi
            fi
          fi

          if [ -n "$CLOSING_ISSUES" ]; then
            ISSUE_LIST=$(echo "$CLOSING_ISSUES" | jq -s -c '.')
            echo "$ISSUE_LIST" | jq -c '.[]' | while IFS= read -r ISSUE_OBJ; do
              ISSUE_ID=$(echo "$ISSUE_OBJ" | jq -r '.id')
              ISSUE_NUM=$(echo "$ISSUE_OBJ" | jq -r '.number')

              ITEM_ID=$(gh api graphql -f query='
                mutation($project: ID!, $issue: ID!) {
                  addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                    item { id }
                  }
                }' \
                -f project="$PROJECT_ID" \
                -f issue="$ISSUE_ID" \
                --jq '.data.addProjectV2ItemById.item.id')

              gh api graphql -f query='
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project,
                    itemId: $item,
                    fieldId: $field,
                    value: { singleSelectOptionId: $option }
                  }) {
                    projectV2Item { id }
                  }
                }' \
                -f project="$PROJECT_ID" \
                -f item="$ITEM_ID" \
                -f field="$STATUS_FIELD_ID" \
                -f option="$IN_REVIEW_OPTION_ID" \
                --silent

              echo "👀 Issue #$ISSUE_NUM movida a IN REVIEW"
            done
          fi

      - name: Agregar label 'needs-qa' al PR
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          gh api /repos/${{ github.repository }}/labels -f name="needs-qa" -f color="fbca04" 2>/dev/null || true
          gh pr edit ${{ github.event.pull_request.number }} --add-label "needs-qa" --repo ${{ github.repository }}

  # ============================================================
  # JOB 5: REVISIÓN DE QA (QA Approved o In Progress)
  # ============================================================
  handle_qa_review:
    name: "Review QA → QA APPROVED o IN PROGRESS"
    if: github.event_name == 'pull_request_review' && github.event.action == 'submitted'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar si el reviewer es QA
        id: check_reviewer
        env:
          REVIEWER: ${{ github.event.review.user.login }}
          QA_USERS: ${{ vars.QA_GITHUB_USERS }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          echo "🔍 Reviewer recibido: '$REVIEWER'"
          echo "🔍 Estado del review: '$REVIEW_STATE'"
          echo "🔍 QA_GITHUB_USERS crudo: '$QA_USERS'"

          # Normalizamos separadores: admite espacios, comas, ';' o saltos de línea
          NORMALIZED_USERS=$(echo "$QA_USERS" | tr ',;' ' ')

          IS_QA=false
          for USER in $NORMALIZED_USERS; do
            USER_TRIMMED=$(echo "$USER" | xargs)
            [ -z "$USER_TRIMMED" ] && continue
            REVIEWER_LOWER=$(echo "$REVIEWER" | tr '[:upper:]' '[:lower:]')
            USER_LOWER=$(echo "$USER_TRIMMED" | tr '[:upper:]' '[:lower:]')
            if [ "$REVIEWER_LOWER" = "$USER_LOWER" ]; then
              IS_QA=true
              break
            fi
          done

          echo "IS_QA=$IS_QA" >> $GITHUB_OUTPUT
          echo "REVIEW_STATE=$REVIEW_STATE" >> $GITHUB_OUTPUT
          echo "✅ Resultado -> IS_QA=$IS_QA | REVIEW_STATE=$REVIEW_STATE"

      # --- QA APRUEBA ---
      - name: Mover issues a QA APPROVED y notificar a Diego
        if: |
          steps.check_reviewer.outputs.IS_QA == 'true' &&
          steps.check_reviewer.outputs.REVIEW_STATE == 'approved'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORGANIZATION: ${{ vars.ORGANIZATION }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          gh api graphql -f query='
            query($org: String!, $number: Int!) {
              user(login: $org) {
                projectV2(number: $number) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' \
            -f org="$ORGANIZATION" \
            -F number=$PROJECT_NUMBER \
            > project_data.json

          PROJECT_ID=$(jq -r '.data.user.projectV2.id' project_data.json)
          STATUS_FIELD_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .id' project_data.json)
          QA_APPROVED_OPTION_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .options[] | select(.name != null and (.name | ascii_downcase) == "qa approved") | .id' project_data.json)

          CLOSING_ISSUES=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 25) {
                    nodes { id number }
                  }
                }
              }
            }' \
            -f owner="$REPO_OWNER" \
            -f repo="$REPO_NAME" \
            -F number=$PR_NUMBER \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]')

          if [ -z "$CLOSING_ISSUES" ]; then
            ISSUE_NUMBER=$(echo "$PR_BRANCH" | grep -oP '(?<![0-9])\d+(?![0-9])' | head -1)
            if [ -n "$ISSUE_NUMBER" ]; then
              ISSUE_DATA=$(gh api /repos/${{ github.repository }}/issues/$ISSUE_NUMBER 2>/dev/null || echo "null")
              if [ "$ISSUE_DATA" != "null" ]; then
                ISSUE_ID=$(echo "$ISSUE_DATA" | jq -r '.node_id')
                CLOSING_ISSUES="{\"id\":\"$ISSUE_ID\",\"number\":$ISSUE_NUMBER}"
              fi
            fi
          fi

          if [ -n "$CLOSING_ISSUES" ]; then
            ISSUE_LIST=$(echo "$CLOSING_ISSUES" | jq -s -c '.')
            echo "$ISSUE_LIST" | jq -c '.[]' | while IFS= read -r ISSUE_OBJ; do
              ISSUE_ID=$(echo "$ISSUE_OBJ" | jq -r '.id')
              ISSUE_NUM=$(echo "$ISSUE_OBJ" | jq -r '.number')

              ITEM_ID=$(gh api graphql -f query='
                mutation($project: ID!, $issue: ID!) {
                  addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                    item { id }
                  }
                }' \
                -f project="$PROJECT_ID" \
                -f issue="$ISSUE_ID" \
                --jq '.data.addProjectV2ItemById.item.id')

              gh api graphql -f query='
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project,
                    itemId: $item,
                    fieldId: $field,
                    value: { singleSelectOptionId: $option }
                  }) {
                    projectV2Item { id }
                  }
                }' \
                -f project="$PROJECT_ID" \
                -f item="$ITEM_ID" \
                -f field="$STATUS_FIELD_ID" \
                -f option="$QA_APPROVED_OPTION_ID" \
                --silent

              echo "✔️ Issue #$ISSUE_NUM movida a QA APPROVED"
            done
          fi

      - name: Labels y Notificación al Scrum Master
        if: |
          steps.check_reviewer.outputs.IS_QA == 'true' &&
          steps.check_reviewer.outputs.REVIEW_STATE == 'approved'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          gh api /repos/${{ github.repository }}/labels -f name="qa-approved" -f color="0e8a16" 2>/dev/null || true
          gh api /repos/${{ github.repository }}/labels -f name="ready-to-merge" -f color="0075ca" 2>/dev/null || true

          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "qa-approved,ready-to-merge" \
            --remove-label "needs-qa,qa-rejected" \
            --repo ${{ github.repository }} 2>/dev/null || true

          COMMENT="## ✅ PR Aprobado por QA — Listo para Mergear

          @dgimenezdeveloper, este PR ha sido **aprobado por QA** (@$REVIEWER) y está listo para ser mergeado a \`develop\`."

          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$COMMENT" \
            --repo ${{ github.repository }}

  # ============================================================
  # JOB 6: MERGEADO → DONE
  # ============================================================
  move_to_done:
    name: "PR mergeado → DONE"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Mover issues a DONE
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORGANIZATION: ${{ vars.ORGANIZATION }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          gh api graphql -f query='
            query($org: String!, $number: Int!) {
              user(login: $org) {
                projectV2(number: $number) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' \
            -f org="$ORGANIZATION" \
            -F number=$PROJECT_NUMBER \
            > project_data.json

          PROJECT_ID=$(jq -r '.data.user.projectV2.id' project_data.json)
          STATUS_FIELD_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .id' project_data.json)
          DONE_OPTION_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .options[] | select(.name != null and (.name | ascii_downcase) == "done") | .id' project_data.json)

          CLOSING_ISSUES=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 25) {
                    nodes { id number }
                  }
                }
              }
            }' \
            -f owner="$REPO_OWNER" \
            -f repo="$REPO_NAME" \
            -F number=$PR_NUMBER \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]')

          if [ -z "$CLOSING_ISSUES" ]; then
            ISSUE_NUMBER=$(echo "$PR_BRANCH" | grep -oP '(?<![0-9])\d+(?![0-9])' | head -1)
            if [ -n "$ISSUE_NUMBER" ]; then
              ISSUE_DATA=$(gh api /repos/${{ github.repository }}/issues/$ISSUE_NUMBER 2>/dev/null || echo "null")
              if [ "$ISSUE_DATA" != "null" ]; then
                ISSUE_ID=$(echo "$ISSUE_DATA" | jq -r '.node_id')
                CLOSING_ISSUES="{\"id\":\"$ISSUE_ID\",\"number\":$ISSUE_NUMBER}"
              fi
            fi
          fi

          if [ -n "$CLOSING_ISSUES" ]; then
            ISSUE_LIST=$(echo "$CLOSING_ISSUES" | jq -s -c '.')
            echo "$ISSUE_LIST" | jq -c '.[]' | while IFS= read -r ISSUE_OBJ; do
              ISSUE_ID=$(echo "$ISSUE_OBJ" | jq -r '.id')
              ISSUE_NUM=$(echo "$ISSUE_OBJ" | jq -r '.number')

              ITEM_ID=$(gh api graphql -f query='
                mutation($project: ID!, $issue: ID!) {
                  addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                    item { id }
                  }
                }' \
                -f project="$PROJECT_ID" \
                -f issue="$ISSUE_ID" \
                --jq '.data.addProjectV2ItemById.item.id')

              gh api graphql -f query='
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project,
                    itemId: $item,
                    fieldId: $field,
                    value: { singleSelectOptionId: $option }
                  }) {
                    projectV2Item { id }
                  }
                }' \
                -f project="$PROJECT_ID" \
                -f item="$ITEM_ID" \
                -f field="$STATUS_FIELD_ID" \
                -f option="$DONE_OPTION_ID" \
                --silent

              echo "🏁 Issue #$ISSUE_NUM movida a DONE"
            done
          fi

  # ============================================================
  # JOB 7: PR CERRADO SIN MERGE → BACKLOG
  # ============================================================
  move_to_backlog_closed_pr:
    name: "PR cerrado sin merge → BACKLOG"
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - name: Mover issues a BACKLOG
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORGANIZATION: ${{ vars.ORGANIZATION }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          gh api graphql -f query='
            query($org: String!, $number: Int!) {
              user(login: $org) {
                projectV2(number: $number) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' \
            -f org="$ORGANIZATION" \
            -F number=$PROJECT_NUMBER \
            > project_data.json

          PROJECT_ID=$(jq -r '.data.user.projectV2.id' project_data.json)
          STATUS_FIELD_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .id' project_data.json)
          BACKLOG_OPTION_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .options[] | select(.name != null and (.name | ascii_downcase) == "backlog") | .id' project_data.json)

          CLOSING_ISSUES=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 25) {
                    nodes { id number }
                  }
                }
              }
            }' \
            -f owner="$REPO_OWNER" \
            -f repo="$REPO_NAME" \
            -F number=$PR_NUMBER \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]')

          if [ -z "$CLOSING_ISSUES" ]; then
            ISSUE_NUMBER=$(echo "$PR_BRANCH" | grep -oP '(?<![0-9])\d+(?![0-9])' | head -1)
            if [ -n "$ISSUE_NUMBER" ]; then
              ISSUE_DATA=$(gh api /repos/${{ github.repository }}/issues/$ISSUE_NUMBER 2>/dev/null || echo "null")
              if [ "$ISSUE_DATA" != "null" ]; then
                ISSUE_ID=$(echo "$ISSUE_DATA" | jq -r '.node_id')
                CLOSING_ISSUES="{\"id\":\"$ISSUE_ID\",\"number\":$ISSUE_NUMBER}"
              fi
            fi
          fi

          if [ -n "$CLOSING_ISSUES" ]; then
            ISSUE_LIST=$(echo "$CLOSING_ISSUES" | jq -s -c '.')
            echo "$ISSUE_LIST" | jq -c '.[]' | while IFS= read -r ISSUE_OBJ; do
              ISSUE_ID=$(echo "$ISSUE_OBJ" | jq -r '.id')
              ISSUE_NUM=$(echo "$ISSUE_OBJ" | jq -r '.number')

              ITEM_ID=$(gh api graphql -f query='
                mutation($project: ID!, $issue: ID!) {
                  addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                    item { id }
                  }
                }' \
                -f project="$PROJECT_ID" \
                -f issue="$ISSUE_ID" \
                --jq '.data.addProjectV2ItemById.item.id')

              gh api graphql -f query='
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project,
                    itemId: $item,
                    fieldId: $field,
                    value: { singleSelectOptionId: $option }
                  }) {
                    projectV2Item { id }
                  }
                }' \
                -f project="$PROJECT_ID" \
                -f item="$ITEM_ID" \
                -f field="$STATUS_FIELD_ID" \
                -f option="$BACKLOG_OPTION_ID" \
                --silent

              echo "📋 Issue #$ISSUE_NUM devuelta a BACKLOG"
            done
          fi

  # ============================================================
  # JOB 8: EJECUCIÓN MANUAL (workflow_dispatch) → Simula/fuerza QA APPROVED
  #
  # Corre el mismo movimiento de tarjeta que dispara una aprobación real
  # de QA, pero a demanda desde la pestaña Actions → "Run workflow",
  # sin depender de aprobar/desaprobar PRs de verdad.
  #
  # dry_run=true  (default): solo MUESTRA qué haría, no mueve ni comenta nada.
  # dry_run=false            : ejecuta el movimiento real + labels + comentario,
  #                            igual que si LeanHerrera97/dgimenezdeveloper
  #                            hubieran aprobado el PR indicado.
  # ============================================================
  manual_test_qa_approved:
    name: "🧪 Manual → Simular/Forzar QA APPROVED"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolver issues vinculadas y mover a QA APPROVED (o simular)
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ORGANIZATION: ${{ vars.ORGANIZATION }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REVIEWER: ${{ github.actor }}
        run: |
          echo "🧪 Ejecución manual disparada por: $REVIEWER"
          echo "🧪 PR objetivo: #$PR_NUMBER | dry_run=$DRY_RUN"

          gh api graphql -f query='
            query($org: String!, $number: Int!) {
              user(login: $org) {
                projectV2(number: $number) {
                  id
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' \
            -f org="$ORGANIZATION" \
            -F number=$PROJECT_NUMBER \
            > project_data.json

          PROJECT_ID=$(jq -r '.data.user.projectV2.id' project_data.json)
          STATUS_FIELD_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .id' project_data.json)
          QA_APPROVED_OPTION_ID=$(jq -r '.data.user.projectV2.fields.nodes[] | select(.name != null and (.name | ascii_downcase) == "status") | .options[] | select(.name != null and (.name | ascii_downcase) == "qa approved") | .id' project_data.json)

          if [ -z "$PROJECT_ID" ] || [ -z "$STATUS_FIELD_ID" ] || [ -z "$QA_APPROVED_OPTION_ID" ]; then
            echo "❌ No pude resolver PROJECT_ID/STATUS_FIELD_ID/QA_APPROVED_OPTION_ID. Revisá ORGANIZATION, PROJECT_NUMBER y que exista la columna 'QA Approved'."
            exit 1
          fi

          CLOSING_ISSUES=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 25) {
                    nodes { id number }
                  }
                }
              }
            }' \
            -f owner="$REPO_OWNER" \
            -f repo="$REPO_NAME" \
            -F number=$PR_NUMBER \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[]')

          if [ -z "$CLOSING_ISSUES" ]; then
            echo "⚠️ El PR #$PR_NUMBER no tiene issues vinculadas vía closingIssuesReferences. Nada para mover."
            exit 0
          fi

          ISSUE_LIST=$(echo "$CLOSING_ISSUES" | jq -s -c '.')
          echo "$ISSUE_LIST" | jq -c '.[]' | while IFS= read -r ISSUE_OBJ; do
            ISSUE_ID=$(echo "$ISSUE_OBJ" | jq -r '.id')
            ISSUE_NUM=$(echo "$ISSUE_OBJ" | jq -r '.number')

            if [ "$DRY_RUN" = "true" ]; then
              echo "🧪 [DRY RUN] Movería Issue #$ISSUE_NUM a QA APPROVED (sin ejecutar mutación real)"
              continue
            fi

            ITEM_ID=$(gh api graphql -f query='
              mutation($project: ID!, $issue: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                  item { id }
                }
              }' \
              -f project="$PROJECT_ID" \
              -f issue="$ISSUE_ID" \
              --jq '.data.addProjectV2ItemById.item.id')

            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project,
                  itemId: $item,
                  fieldId: $field,
                  value: { singleSelectOptionId: $option }
                }) {
                  projectV2Item { id }
                }
              }' \
              -f project="$PROJECT_ID" \
              -f item="$ITEM_ID" \
              -f field="$STATUS_FIELD_ID" \
              -f option="$QA_APPROVED_OPTION_ID" \
              --silent

            echo "✔️ Issue #$ISSUE_NUM movida a QA APPROVED (forzado manualmente)"
          done

      - name: Labels y comentario (solo si dry_run=false)
        if: github.event.inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REVIEWER: ${{ github.actor }}
        run: |
          gh api /repos/${{ github.repository }}/labels -f name="qa-approved" -f color="0e8a16" 2>/dev/null || true
          gh api /repos/${{ github.repository }}/labels -f name="ready-to-merge" -f color="0075ca" 2>/dev/null || true

          gh pr edit ${{ github.event.inputs.pr_number }} \
            --add-label "qa-approved,ready-to-merge" \
            --remove-label "needs-qa,qa-rejected" \
            --repo ${{ github.repository }} 2>/dev/null || true

          COMMENT="## ✅ PR Aprobado por QA — Listo para Mergear (forzado manualmente)

          @dgimenezdeveloper, este PR fue movido a **QA Approved** manualmente vía workflow_dispatch por @$REVIEWER."

          gh pr comment ${{ github.event.inputs.pr_number }} \
            --body "$COMMENT" \
            --repo ${{ github.repository }}