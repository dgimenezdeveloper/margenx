name: Continuous Integration (CI)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-check:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar compilación TypeScript
        run: npm run build

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter
        run: npm run lint

      - name: Verificar Build de Producción
        run: npm run build

  e2e-tests:
      name: E2E Tests Suite (Playwright)
      runs-on: ubuntu-latest
      needs: [backend-check, frontend-check]
      services:
        postgres:
          image: postgres:16-alpine
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password123
            POSTGRES_DB: margenx_test
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
      env:
        CI: true
        PORT: 3021
        DATABASE_URL: "postgresql://postgres:password123@localhost:5432/margenx_test?schema=public"
        VITE_API_URL: "http://localhost:3021/api"
        SEED_CONFIRM_TARGET: "localhost:5432/margenx_test" # <--- ¡Agregado aquí por seguridad del seed!
        VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        E2E_CLERK_TEST_EMAIL: ${{ secrets.E2E_CLERK_TEST_EMAIL }}
        E2E_CLERK_TEST_PASSWORD: ${{ secrets.E2E_CLERK_TEST_PASSWORD }}
      steps:
        - name: Checkout del código
          uses: actions/checkout@v4

        - name: Setup Node.js 20
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'
            cache-dependency-path: |
              frontend/package-lock.json
              backend/package-lock.json

        - name: Instalar dependencias del Backend
          working-directory: ./backend
          run: npm ci

        - name: Ejecutar Migraciones y Seed en Base de Datos de Test
          working-directory: ./backend
          run: |
            npx prisma migrate deploy
            npx prisma db seed

        - name: Levantar Backend en Segundo Plano
          working-directory: ./backend
          run: |
            npm run build
            npm run start &
            npx wait-on http://localhost:3021/health || npx wait-on http://localhost:3021/api || sleep 5

        - name: Instalar dependencias del Frontend
          working-directory: ./frontend
          run: npm ci

        - name: Instalar navegador Chromium para Playwright
          working-directory: ./frontend
          run: npx playwright install --with-deps chromium

        - name: Ejecutar Suite E2E Completa
          working-directory: ./frontend
          run: npx playwright test --project=chromium

        - name: Subir reporte Playwright en caso de fallo
          uses: actions/upload-artifact@v4
          if: failure()
          with:
            name: playwright-report
            path: frontend/playwright-report/
            retention-days: 7

  notify-ci-failure:
    name: Notificar Fallo en Discord
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check, e2e-tests]
    if: failure()
    steps:
      - name: Enviar alerta a Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH_OR_REF: "${{ github.head_ref || github.ref_name }}"
          AUTHOR: "${{ github.actor }}"
          COMMIT_MSG: "${{ github.event.head_commit.message || github.event.pull_request.title || 'Commit en PR' }}"
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "⚠️ DISCORD_WEBHOOK_URL no configurado. Omitiendo notificación."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg content "🚨 **Fallo en Pipeline de CI — MargenX**" \
            --arg title "Falló la verificación de CI (Lint / Build / E2E Suite)" \
            --arg run_url "$RUN_URL" \
            --arg branch "$BRANCH_OR_REF" \
            --arg author "$AUTHOR" \
            --arg commit "$COMMIT_MSG" \
            '{
              content: $content,
              embeds: [
                {
                  title: $title,
                  url: $run_url,
                  color: 15158332,
                  fields: [
                    { name: "Rama / Ref", value: $branch, inline: true },
                    { name: "Disparado por", value: $author, inline: true },
                    { name: "Mensaje / PR", value: $commit, inline: false },
                    { name: "Detalles del Error", value: ("[Ver Logs en GitHub Actions](" + $run_url + ")"), inline: false }
                  ],
                  timestamp: (now | todate)
                }
              ]
            }')

          curl -s -S -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK" || echo "Error enviando notificación a Discord"