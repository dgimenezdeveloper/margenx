# ==============================================================================
# MARGENX - Proxy Satélite n8n (Host VPS)
# Dominio: n8n.margenx.tech
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name n8n.margenx.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n8n.margenx.tech;

    ssl_certificate /etc/letsencrypt/live/n8n.margenx.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.margenx.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cabeceras de Seguridad y Aislamiento de Buscadores
    add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Permitir subida de planillas extensas (límite satélite n8n)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tiempos de espera extendidos para ejecución de workflows de ingesta y PDF
        proxy_connect_timeout 120s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}