version: '3.8'

services:
  # ========================================================
  # Base de Datos PostgreSQL Compartida (Aloja margenx_prod y margenx_dev)
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: margenx_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_PROD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # n8n Satélite (Orquestador de Alertas y Reportes)
  # ========================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: margenx_n8n_prod
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - NODE_OPTIONS=--max-old-space-size=768
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - INTERNAL_WEBHOOK_SECRET=${INTERNAL_WEBHOOK_SECRET}
      - MARGENX_API_URL=${MARGENX_API_URL}
      - IMAP_USER=${IMAP_USER}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    volumes:
      - ./data/n8n:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # ENTORNO PRODUCCIÓN (Rama main)
  # ========================================================
  backend-prod:
    image: ${DOCKER_USERNAME}/margenx-backend:latest
    container_name: margenx_backend_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:3011:3000"
    networks:
      - margenx_network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend-prod:
    image: ${DOCKER_USERNAME}/margenx-frontend:latest
    container_name: margenx_frontend_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:80"
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # ENTORNO STAGING / DEV (Rama develop)
  # ========================================================
  backend-dev:
    image: ${DOCKER_USERNAME}/margenx-backend:dev
    container_name: margenx_backend_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:3021:3000"
    networks:
      - margenx_network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend-dev:
    image: ${DOCKER_USERNAME}/margenx-frontend:dev
    container_name: margenx_frontend_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:80"
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  margenx_network:
    name: margenx_network
    driver: bridge