services:
  # ========================================================
  # Base de Datos PostgreSQL Compartida (Staging + Prod)
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: margenx_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # n8n Orquestador Satélite
  # ========================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: margenx_n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=n8n.margenx.tech
      - WEBHOOK_URL=https://n8n.margenx.tech/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # PRODUCCIÓN: Backend API
  # ========================================================
  backend-prod:
    image: ${DOCKER_USERNAME}/margenx-backend:latest
    container_name: margenx_backend_prod
    restart: always
    ports:
      - "127.0.0.1:3011:3000"
    env_file:
      - .env.prod
    networks:
      - margenx_network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # PRODUCCIÓN: Frontend SPA
  # ========================================================
  frontend-prod:
    image: ${DOCKER_USERNAME}/margenx-frontend:latest
    container_name: margenx_frontend_prod
    restart: always
    ports:
      - "127.0.0.1:3010:80"
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # STAGING: Backend API
  # ========================================================
  backend-dev:
    image: ${DOCKER_USERNAME}/margenx-backend:dev
    container_name: margenx_backend_dev
    restart: always
    ports:
      - "127.0.0.1:3021:3000"
    env_file:
      - .env.dev
    networks:
      - margenx_network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # STAGING: Frontend SPA
  # ========================================================
  frontend-dev:
    image: ${DOCKER_USERNAME}/margenx-frontend:dev
    container_name: margenx_frontend_dev
    restart: always
    ports:
      - "127.0.0.1:3020:80"
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  margenx_network:
    external: true

volumes:
  postgres_data:
  n8n_data: