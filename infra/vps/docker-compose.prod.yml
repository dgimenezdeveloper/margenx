version: '3.8'

services:
  # ========================================================
  # Base de Datos PostgreSQL Compartida (Aloja margenx_prod y margenx_dev)
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: margenx_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_PROD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # Solo loopback: Postgres NO debe quedar expuesto a internet. Los backends lo usan por la red interna (postgres:5432).
      # Acceso externo (DBeaver, etc.): túnel SSH -> ssh -L 5435:127.0.0.1:5435 usuario@vps
      - "127.0.0.1:5435:5432"
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # n8n Satélite (Orquestador de Alertas y Reportes)
  # ========================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: margenx_n8n_prod
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - NODE_OPTIONS=--max-old-space-size=768
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - INTERNAL_WEBHOOK_SECRET=${INTERNAL_WEBHOOK_SECRET}
      - MARGENX_API_URL=${MARGENX_API_URL}
      - MARGENX_DEV_API_URL=${MARGENX_DEV_API_URL:-}
      - IMAP_USER=${IMAP_USER}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      # Reporte semanal (ADR-009): backends y Gotenberg por la red interna, porque Nginx niega /api/internal/ desde afuera
      - MARGENX_INTERNAL_API_URL=${MARGENX_INTERNAL_API_URL:-http://backend-prod:3000}
      - MARGENX_INTERNAL_DEV_API_URL=${MARGENX_INTERNAL_DEV_API_URL:-http://backend-dev:3000}
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg:3000}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    volumes:
      - ./data/n8n:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # Gotenberg: HTML a PDF para el reporte semanal (ADR-009)
  # Solo red interna (sin puertos publicados): lo llama n8n en http://gotenberg:3000.
  # Chromium arranca con la primera conversión y se apaga tras 60 s sin uso, así que en reposo ocupa ~25 MB.
  # Sin JavaScript y sin descargas: solo puede leer el HTML que recibe (file:///tmp).
  # ========================================================
  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    container_name: margenx_gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=30s
      - --chromium-auto-start=false
      - --chromium-idle-shutdown-timeout=60s
      - --chromium-max-concurrency=2
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # ENTORNO PRODUCCIÓN (Rama main)
  # ========================================================
  backend-prod:
    image: ${DOCKER_USERNAME}/margenx-backend:latest
    container_name: margenx_backend_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_PROD}?schema=public
      - APP_BASE_URL=https://margenx.tech
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY_PROD}
      - CLERK_JWT_KEY=${CLERK_JWT_KEY_PROD}
    ports:
      - "127.0.0.1:3011:3000"
    networks:
      - margenx_network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend-prod:
    image: ${DOCKER_USERNAME}/margenx-frontend:latest
    container_name: margenx_frontend_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:80"
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # ENTORNO STAGING / DEV (Rama develop)
  # ========================================================
  backend-dev:
    image: ${DOCKER_USERNAME}/margenx-backend:dev
    container_name: margenx_backend_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_DEV}?schema=public
      - APP_BASE_URL=https://dev.margenx.tech
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY_DEV}
      - CLERK_JWT_KEY=${CLERK_JWT_KEY_DEV}
    ports:
      - "127.0.0.1:3021:3000"
    networks:
      - margenx_network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend-dev:
    image: ${DOCKER_USERNAME}/margenx-frontend:dev
    container_name: margenx_frontend_dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:80"
    networks:
      - margenx_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  margenx_network:
    name: margenx_network
    driver: bridge