server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para JS/CSS/JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml;

    # Cabeceras de seguridad básicas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caché estricto para assets estáticos con hash de Vite
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Manifest de la PWA: tipo explícito y sin caché inmutable (no lleva hash, se revalida en cada carga).
    # Se usa expires y no add_header para no perder las cabeceras de seguridad del bloque server.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires -1;
    }

    # Service worker y página Sin conexión: sin hash y sin caché inmutable, para que la versión nueva
    # se detecte en la próxima apertura. Igual que el manifest, expires no pisa las cabeceras de seguridad.
    location = /sw.js {
        expires -1;
    }
    location = /offline.html {
        expires -1;
    }

    # Redirección SPA para React Router (HTML5 History API).
    # index.html no lleva hash: se revalida siempre para no cargar un HTML que apunte a assets de otra versión.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Evitar logs de favicon y robots
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}