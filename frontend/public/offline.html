<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Sin conexión — MargenX</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Página de respaldo del service worker (pwa.config.ts). Es autónoma: sin React, sin Clerk y sin datos del comercio. -->
    <style>
      :root {
        color-scheme: light;
        --bg: #f9fafb;
        --card: #ffffff;
        --text: #111827;
        --muted: #4b5563;
        --brand: #4f46e5;
        --brand-hover: #4338ca;
      }
      :root.dark {
        color-scheme: dark;
        --bg: #030712;
        --card: #111827;
        --text: #f3f4f6;
        --muted: #d1d5db;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 24rem;
        padding: 32px 24px;
        border-radius: 24px;
        background: var(--card);
        text-align: center;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.08);
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 24px;
        font-size: 0.95rem;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: var(--brand);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: var(--brand-hover);
      }
      button:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 2px;
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark)) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main>
      <img src="/icon-192x192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>No pudimos conectarnos con MargenX. Revisá el wifi o los datos móviles y volvé a intentar.</p>
      <button type="button" id="reintentar">Reintentar</button>
    </main>
    <script>
      document.getElementById('reintentar').addEventListener('click', function () {
        location.reload();
      });
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
